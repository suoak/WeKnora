# Independent build-host instance ONLY. Project name and port are generated and
# checked by v1_deploy.py. No production mounts, keys or external DB connection.
services:
  postgres:
    image: paradedb/paradedb:v0.22.2-pg17
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: knowhub_v1
    volumes: ["pg:/var/lib/postgresql/data", "pgsocket:/var/run/postgresql"]
    networks: [isolated]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d knowhub_v1"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7.0-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes: ["redis:/data"]
    networks: [isolated]
  model:
    image: weknora-custom/mcp-candidate:v0.8.0-knowhub.24-rc1-854f3b95
    entrypoint: ["python", "/fixture.py"]
    volumes: ["./source/docs/integration/knowhub-mcp-portal/tools/v1_model_fixture.py:/fixture.py:ro"]
    networks: [isolated]
  feishu:
    image: weknora-custom/mcp-candidate:v0.8.0-knowhub.24-rc1-854f3b95
    entrypoint: ["python", "/fixture.py"]
    volumes: ["./source/docs/integration/knowhub-mcp-portal/tools/joint_feishu_fixture.py:/fixture.py:ro"]
    networks: [isolated]
  app:
    image: ${V1_APP_IMAGE}
    env_file: ["./private/app.env"]
    environment:
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_NAME: knowhub_v1
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      RETRIEVE_DRIVER: postgres
      STORAGE_TYPE: local
      LOCAL_STORAGE_BASE_DIR: /data/files
      GIN_MODE: release
      AUTO_RECOVER_DIRTY: "false"
      WEKNORA_TENANT_ENABLE_RBAC: "true"
      SSRF_WHITELIST: model,feishu
      LOG_LEVEL: info
      FEISHU_DOCX_PARSE_MODE: blocks
      FEISHU_LEGACY_SYNC_SUSPENDED: "false"
      FEISHU_API_RETRY_MAX: "0"
      MCP_PUBLIC_URL: http://127.0.0.1:${V1_WEB_PORT}
    volumes: ["files:/data/files", "./runtime-config.yaml:/app/config/config.yaml:ro"]
    networks: [isolated]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 3s
      retries: 40
      start_period: 15s
  frontend:
    image: ${V1_FRONTEND_IMAGE}
    environment:
      APP_HOST: app
      APP_PORT: "8080"
      APP_SCHEME: http
    ports: ["127.0.0.1:${V1_WEB_PORT}:80"]
    depends_on:
      app: {condition: service_healthy}
    networks: [isolated, edge]
networks:
  edge:
    ipam:
      config: [{subnet: "${V1_EDGE_SUBNET:?isolated edge subnet must be checked}"}]
  isolated:
    internal: true
    ipam:
      config: [{subnet: "${V1_SUBNET:?isolated subnet must be checked}"}]
volumes:
  pg: {}
  pgsocket: {}
  redis: {}
  files: {}
