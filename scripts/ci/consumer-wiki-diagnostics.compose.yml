# Disposable qualification project. Never attach this network to an existing
# application network or substitute production endpoints/credentials.
services:
  redis:
    image: redis:7.4-alpine
    networks:
      default:
        aliases: [knowhub-recovery-redis-d1a600112525]
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 1s
      retries: 20
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: disposable-diagnostics-only
      POSTGRES_DB: diagnostics_test
    volumes:
      - diagnostics-pg:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d diagnostics_test]
      interval: 2s
      timeout: 1s
      retries: 20
  runner:
    image: ${DIAGNOSTICS_RUNNER_IMAGE:?test runner image required}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        /diagnostics/consumer.test -test.v -test.timeout=10m > /evidence/consumer-tests.log 2>&1
        /diagnostics/wiki.test -test.v -test.run 'TestWikiOwnership|TestWikiRecovery|TestWikiBlocked|TestWikiDocumentSelection|TestWiki.*(Generation|Lease|Claim|Finaliz)' -test.timeout=10m > /evidence/wiki-tests.log 2>&1
        printf 'PASS\n' > /evidence/result.txt
    environment:
      FEISHU_RECOVERY_REAL_REDIS_ADDR: knowhub-recovery-redis-d1a600112525:6379
      SYNC_EXECUTION_POSTGRES_DSN: postgres://postgres:disposable-diagnostics-only@postgres:5432/diagnostics_test?sslmode=disable
      REQUIRE_SYNC_EXECUTION_POSTGRES: '1'
      GOMAXPROCS: '2'
    volumes:
      - ${DIAGNOSTICS_BIN_DIR:?test binaries required}:/diagnostics:ro
      - ${DIAGNOSTICS_EVIDENCE_DIR:?audit directory required}:/evidence
    tmpfs:
      - /tmp:size=128m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
networks:
  default:
    internal: true
volumes:
  diagnostics-pg:
