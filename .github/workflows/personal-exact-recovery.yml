name: Personal Exact File Recovery

on:
  push:
    branches: [fix/personal-file-recovery-production-20261030]
  pull_request:
    branches: [main]
    paths:
      - "internal/application/**"
      - "internal/types/**"
      - "internal/testutil/syncdb/**"
      - ".github/workflows/personal-exact-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-exact-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  postgres-proof-and-race:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: paradedb/paradedb:v0.22.2-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exact_recovery
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d exact_recovery"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      SYNC_EXECUTION_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/exact_recovery?sslmode=disable
      FEISHU_LEGACY_TEST_DSN: postgres://postgres:postgres@localhost:5432/exact_recovery?sslmode=disable
      REQUIRE_SYNC_EXECUTION_POSTGRES: "1"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true
      - name: Verify exact source identity
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "VALIDATION_HEAD_SHA=$SOURCE_SHA"
          git diff --check
      - name: Exact proof, write fences, metadata status and adapter regressions
        run: |
          go test -tags sqlite_fts5 ./internal/types ./internal/application/repository \
            ./internal/application/repository/retriever/postgres ./internal/application/service \
            ./internal/application/service/chat_pipeline ./internal/router \
            -run 'TestExactDocument|TestPersonalRecoveryExact|TestExactPersonal|TestSyncTaskExecutor' \
            -count=1 -timeout=15m
      - name: Exact proof concurrency race
        run: |
          go test -race -tags sqlite_fts5 ./internal/types ./internal/application/service \
            -run 'TestExactDocumentScope|TestPersonalRecoveryExactExecution|TestExactPersonalModel' \
            -count=1 -timeout=15m
