name: Feishu automatic service qualification
on:
  workflow_dispatch:
  push:
    branches: [fix/feishu-self-recovery-20261126]
  pull_request:
    branches: [main]
    paths:
      - internal/feishusynccontrol/**
      - internal/feishusafety/**
      - internal/application/access/source_write*
      - internal/application/service/datasource*
      - internal/application/repository/datasource*
      - internal/application/repository/tenant_api_key.go
      - internal/datasource/scheduler*
      - internal/types/sync_admission.go
      - internal/types/tenant_api_key_errors.go
      - internal/container/feishu_sync*
      - .github/workflows/feishu-automatic-service.yml
permissions:
  contents: read
concurrency:
  group: feishu-automatic-service-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: paradedb/paradedb:v0.22.2-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-automatic-test
          POSTGRES_DB: feishu_atomic_test
        ports: ['5432:5432']
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres -d feishu_atomic_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-bookworm
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
      FEISHU_LEGACY_TEST_DSN: postgres://postgres:disposable-automatic-test@localhost:5432/feishu_atomic_test?sslmode=disable
      SYNC_EXECUTION_POSTGRES_DSN: postgres://postgres:disposable-automatic-test@localhost:5432/feishu_atomic_test?sslmode=disable
      REQUIRE_SYNC_EXECUTION_POSTGRES: '1'
      FEISHU_RECOVERY_REAL_REDIS_ADDR: knowhub-recovery-redis-abcdef123456:6379
      FEISHU_SAFETY_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare owned isolated dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libsqlite3-dev
          echo '127.0.0.1 knowhub-recovery-redis-abcdef123456' | sudo tee -a /etc/hosts >/dev/null
          docker cp '${{ job.services.redis.id }}:/usr/local/bin/redis-server' "$RUNNER_TEMP/knowhub-owned-redis-server"
          chmod 700 "$RUNNER_TEMP/knowhub-owned-redis-server"
          "$RUNNER_TEMP/knowhub-owned-redis-server" --version
          echo "FEISHU_SAFETY_REDIS_EXECUTABLE=$RUNNER_TEMP/knowhub-owned-redis-server" >> "$GITHUB_ENV"
          mkdir evidence
          git rev-parse HEAD | tee evidence/source-sha.txt
          git diff --check
          test -z "$(gofmt -l internal/feishusynccontrol/automatic_service*.go internal/feishusafety/automatic_service*.go internal/application/access/source_write*.go)"
      - name: State authority SQL Redis and race regression
        run: |
          set -o pipefail
          go test -json -race -p 1 ./internal/feishusynccontrol ./internal/feishusafety ./internal/application/access -count=1 -timeout=20m | tee evidence/automatic-service.jsonl
      - name: Real SQL claim and pending request regression
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          go test -json -race -p 1 ./internal/application/repository ./internal/datasource -run '^TestAutomaticService|^TestSchedulerAutomaticService' -count=1 -timeout=5m | tee evidence/automatic-claim.jsonl
      - name: Vet state and authority packages
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          go vet ./internal/feishusynccontrol ./internal/feishusafety ./internal/application/access 2>&1 | tee evidence/vet.txt
      - name: APP wiring compile and upload admission regression
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          go test -json -p 1 ./internal/container ./internal/application/service ./internal/handler -run '^(TestOfficeHTTP|TestSteadyManualSyncErrors|TestProtectedSourceRecoveryInstructions)' -count=1 -timeout=10m | tee evidence/app-wiring.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-service-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          retention-days: 14
