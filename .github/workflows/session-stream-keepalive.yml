name: Session SSE keepalive regressions

on:
  pull_request:
    branches: [main]
    paths:
      - "internal/handler/session/**"
      - ".github/workflows/session-stream-keepalive.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream:
    name: Session idle comments, replay and stream race regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true
      - name: Verify idle comments and existing stream contracts
        run: >-
          go test -race -count=1 -timeout=3m ./internal/handler/session
          -run 'TestSSEKeepAlive|TestContinueStream|Test.*Stream|Test.*SSE'
