name: Office draft Python MCP compatibility
on:
  workflow_dispatch:
  push:
    branches: [ci/office-python-compatibility]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  SOURCE_SHA: a813f7115e596eb271dcaf3c5c5e8f4980b0e179
jobs:
  python-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: a813f7115e596eb271dcaf3c5c5e8f4980b0e179
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install declared dependencies and run the omitted transport regressions
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          python -m pip install -r mcp-server/requirements.txt 2>&1 | tee evidence/dependencies.txt
          python -m pip freeze > evidence/dependency-versions.txt
          (cd mcp-server && python -m unittest -v test_mcp_transports.py) 2>&1 | tee evidence/python-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-python-a813f7115
          path: evidence/
          retention-days: 14
