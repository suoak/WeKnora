name: Portal notification migration

on:
  pull_request:
    paths:
      - 'migrations/**/003050_user_notifications.*.sql'
      - 'testdata/migrations/portal_notifications_postgres.sql'
      - '.github/workflows/portal-notifications.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: portal-notifications-synthetic
          POSTGRES_DB: portal_notifications_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: portal_notifications_test
      PGPASSWORD: portal-notifications-synthetic
    steps:
      - uses: actions/checkout@v6
      - name: Verify PostgreSQL upgrade, rollback, defaults and event uniqueness
        run: psql -X -v ON_ERROR_STOP=1 -f testdata/migrations/portal_notifications_postgres.sql
