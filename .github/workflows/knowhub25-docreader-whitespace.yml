name: KnowHub25 HTML MHTML whitespace contract
on:
  push:
    branches: [integration/knowhub25-docreader-whitespace-20261012]
permissions:
  contents: read
concurrency:
  group: knowhub25-docreader-whitespace-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    if: github.repository == 'suoak/WeKnora' && github.ref == 'refs/heads/integration/knowhub25-docreader-whitespace-20261012'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10.18'
      - name: Fail closed lifecycle and summary self tests
        run: python -B .github/scripts/knowhub25_docreader_whitespace_ci.py --self-test
      - name: Locked dependencies and complete HTML MHTML suites
        run: python -B .github/scripts/knowhub25_docreader_whitespace_ci.py
      - name: Publish reviewed fixed metadata only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: knowhub25-docreader-whitespace-reviewed-${{ github.sha }}
          path: ${{ runner.temp }}/docreader-whitespace-reviewed/summary.json
          if-no-files-found: error
          retention-days: 7
