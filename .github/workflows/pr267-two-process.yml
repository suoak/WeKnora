name: PR267 disposable two-process safety qualification
on:
  push:
    branches: [ci/pr267-two-process-20261126]
    paths: [.github/workflows/pr267-two-process.yml]
permissions:
  contents: read
jobs:
  two-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
      FEISHU_CONTROL_REAL_REDIS: '1'
      FEISHU_CONTROL_DISPOSABLE_REDIS: '1'
      FEISHU_P0_REDIS_ADDR: '127.0.0.1:6379'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 8e0242c4dc4de826dbba09aaf43496370d2fb3eb
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache: true
      - name: Bind exact source and run only missing two-process gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          test "$(git rev-parse HEAD)" = '8e0242c4dc4de826dbba09aaf43496370d2fb3eb'
          git rev-parse HEAD > evidence/source-sha.txt
          go test -json -race -p 1 ./internal/feishusynccontrol -run '^TestAutomaticRealRedisTwoProcess(JoiningAndLoss|BudgetFaults)$' -count=1 -timeout=8m | tee evidence/two-process.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr267-two-process-8e0242c4dc4de826dbba09aaf43496370d2fb3eb
          path: evidence/
          retention-days: 90
