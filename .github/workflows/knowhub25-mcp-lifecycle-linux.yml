name: KnowHub25 MCP Token lifecycle Linux risk characterization
on:
  push:
    branches: [ci/knowhub25-mcp-lifecycle-20261009]
permissions:
  contents: read
concurrency:
  group: knowhub25-mcp-lifecycle-${{ github.ref }}
  cancel-in-progress: false
env:
  CGO_ENABLED: '1'
  GOTOOLCHAIN: local
jobs:
  compare:
    if: github.repository == 'suoak/WeKnora' && github.ref == 'refs/heads/ci/knowhub25-mcp-lifecycle-20261009'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Initialize evidence
        run: |
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          uname -a > "$GITHUB_WORKSPACE/evidence/runner.txt"
          printf 'ImageOS=%s ImageVersion=%s RunnerArch=%s\n' "$ImageOS" "$ImageVersion" "$RUNNER_ARCH" >> "$GITHUB_WORKSPACE/evidence/runner.txt"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, existing reviewed pin
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ac7dbe5e2607af5ab4e74c062137e0cad48d0e50
          path: baseline
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0, existing reviewed pin
        with:
          go-version: '1.26.7'
          architecture: x64
          cache: false
      - name: Verify identities and run complete packages
        env:
          GOMODCACHE: ${{ runner.temp }}/knowhub25-mcp-lifecycle-modules
          GOCACHE: ${{ runner.temp }}/knowhub25-mcp-lifecycle-build
        run: python3 -B candidate/.github/scripts/knowhub25_mcp_lifecycle_ci.py
      - name: Preserve evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, existing reviewed pin
        with:
          name: knowhub25-mcp-lifecycle-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/**/*.json
            evidence/**/*.jsonl
            evidence/**/*.log
            evidence/**/*.txt
          if-no-files-found: error
          retention-days: 14
