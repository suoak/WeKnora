name: AnyDoc Release Baseline v2

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/anydoc-release-baseline.yml"
      - "docker/Dockerfile.app.knowhub-release"
      - ".github/anydoc-baseline/**"

concurrency:
  group: anydoc-release-baseline-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_SHA: da44b4bb30a1b626bfa6e49e189aa7676c02a78e
  GO_VERSION: "1.26.7"
  RUST_VERSION: "1.98.1"
  ANYDOC_VERSION: "0.2.4"
  ANYDOC_SHA256: cf0d78e4cfe3654eb3ea04422ec5a94352000ee56e97902125e68e51f7527062
  MIGRATE_VERSION: "4.20.1"
  UV_VERSION: "0.12.15"
  IMAGE: knowhub/app:anydoc-0.2.4-baseline-ci
  RUSTUP_DIST_SERVER: https://mirrors.ustc.edu.cn/rust-static

jobs:
  baseline:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'build/anydoc-0.2.4-baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout validation recipe
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: baseline

      - name: Checkout frozen application source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 0

      - name: Verify frozen source identity
        working-directory: source
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          echo "SOURCE_SHA=$actual"
          test "$actual" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up exact Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: source/go.sum

      - name: Set up exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Verify pinned toolchains
        run: |
          set -euo pipefail
          go version | tee /tmp/go-version.txt
          rustc --version | tee /tmp/rust-version.txt
          cargo --version
          uname -a
          gcc --version | head -1
          grep -F "go${GO_VERSION}" /tmp/go-version.txt
          grep -F "rustc ${RUST_VERSION} " /tmp/rust-version.txt
          echo "TOOLCHAIN_PIN_GATE=PASS"

      - name: Configure Cargo mirror
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo"
          cat > "$HOME/.cargo/config.toml" <<'EOF'
          [source.crates-io]
          replace-with = "ustc"
          [source.ustc]
          registry = "sparse+https://mirrors.ustc.edu.cn/crates.io-index/"
          EOF

      - name: Verify AnyDoc version and source checksum
        working-directory: source
        run: |
          set -euo pipefail
          grep -Fx 'anydoc = "=0.2.4"' third_party/anydoc-go/Cargo.toml
          grep -Fx 'const Version = "0.2.4"' third_party/anydoc-go/version.go
          crate=/tmp/anydoc-${ANYDOC_VERSION}.crate
          curl --fail --location --silent --show-error \
            "https://static.crates.io/crates/anydoc/anydoc-${ANYDOC_VERSION}.crate" \
            --output "$crate"
          echo "${ANYDOC_SHA256}  $crate" | sha256sum --check --strict
          mkdir -p "$HOME/.cargo/registry/src/verified"
          tar -xzf "$crate" -C "$HOME/.cargo/registry/src/verified"
          test -f "$HOME/.cargo/registry/src/verified/anydoc-${ANYDOC_VERSION}/Cargo.toml"
          echo "ANYDOC_VERSION_GATE=PASS"
          echo "ANYDOC_CHECKSUM_GATE=PASS"

      - name: Build and inspect AnyDoc static archive
        working-directory: source
        run: |
          set -euo pipefail
          ./scripts/build-anydoc-lib.sh
          archive=third_party/anydoc-go/lib/linux_amd64_gnu/libanydoc_go.a
          test -s "$archive"
          file "$archive" | tee /tmp/anydoc-file.txt
          ar t "$archive" >/tmp/anydoc-ar-members.txt
          test -s /tmp/anydoc-ar-members.txt
          nm -g --defined-only "$archive" >/tmp/anydoc-symbols.txt
          grep -E ' anydoc_to_document$' /tmp/anydoc-symbols.txt
          grep -E ' anydoc_to_document_with_asset_links$' /tmp/anydoc-symbols.txt
          while read -r symbol; do
            grep -E " ${symbol}$" /tmp/anydoc-symbols.txt >/dev/null
          done < <(sed -nE 's/^(int|void|const char \*) (anydoc_[a-zA-Z0-9_]+)\(.*/\2/p' third_party/anydoc-go/include/anydoc.h)
          echo "RUST_1_98_1_COMPAT_GATE=PASS"
          echo "ANYDOC_STATIC_BUILD_GATE=PASS"
          echo "ANYDOC_SYMBOL_GATE=PASS"

      - name: Linked CGO vet test race and server build
        working-directory: source
        run: |
          set -euo pipefail
          cp ../baseline/.github/anydoc-baseline/multi_asset_linked_test.go \
            internal/infrastructure/docparser/anydoc/baseline_multi_asset_linked_test.go
          trap 'rm -f internal/infrastructure/docparser/anydoc/baseline_multi_asset_linked_test.go' EXIT
          go vet -tags anydoc ./internal/infrastructure/docparser/...
          go test -tags anydoc -count=1 ./internal/infrastructure/docparser/...
          go test -race -tags anydoc -count=1 ./internal/infrastructure/docparser/anydoc
          go build -tags anydoc -o /tmp/WeKnora ./cmd/server
          go version -m /tmp/WeKnora | tee /tmp/server-build-info.txt
          grep -F -- '-tags=anydoc' /tmp/server-build-info.txt
          grep -F 'CGO_ENABLED=1' /tmp/server-build-info.txt
          grep -F "go${GO_VERSION}" /tmp/server-build-info.txt
          echo "CGO_FFI_GATE=PASS"
          echo "LINKED_GO_VET_GATE=PASS"
          echo "LINKED_GO_TEST_GATE=PASS"
          echo "LINKED_SERVER_BUILD_GATE=PASS"

      - name: Verify source tree restored after validation overlay
        working-directory: source
        run: |
          set -euo pipefail
          rm -rf third_party/anydoc-go/patched-anydoc \
            third_party/anydoc-go/target \
            third_party/anydoc-go/lib/linux_amd64_gnu/libanydoc_go.a
          test -z "$(git status --porcelain)"

      - name: Build production-shaped runtime and validation images
        run: |
          set -euo pipefail
          created=$(git -C source show -s --format=%cI "$SOURCE_SHA")
          common=(
            --platform linux/amd64
            --build-arg "VERSION_ARG=0.8.0-baseline-test"
            --build-arg "COMMIT_ID_ARG=${SOURCE_SHA:0:8}"
            --build-arg "REVISION_ARG=$SOURCE_SHA"
            --build-arg "BUILD_TIME_ARG=$created"
            --build-arg "GO_VERSION_ARG=$GO_VERSION"
            --build-arg "WITH_ANYDOC=1"
            --build-arg "GOPROXY_ARG=https://goproxy.cn,direct"
            --build-arg "GOSUMDB_ARG=sum.golang.org"
            -f baseline/docker/Dockerfile.app.knowhub-release
          )
          docker build "${common[@]}" --target runtime -t "$IMAGE" source
          docker build "${common[@]}" --target validation -t "${IMAGE}-validation" source
          echo "DOCKER_BUILD_WITH_ANYDOC_GATE=PASS"

      - name: Verify image identity and pinned tools
        run: |
          set -euo pipefail
          docker image inspect "$IMAGE" > /tmp/image-inspect.json
          test "$(jq -r '.[0].Architecture' /tmp/image-inspect.json)" = amd64
          test "$(jq -r '.[0].Os' /tmp/image-inspect.json)" = linux
          test "$(jq -r '.[0].Config.Labels["org.opencontainers.image.revision"]' /tmp/image-inspect.json)" = "$SOURCE_SHA"
          test "$(jq -r '.[0].Config.Labels["org.opencontainers.image.version"]' /tmp/image-inspect.json)" = 0.8.0-baseline-test
          test "$(jq -r '.[0].Config.Labels["org.opencontainers.image.source"]' /tmp/image-inspect.json)" = https://github.com/suoak/WeKnora
          identity_container=$(docker create "$IMAGE")
          trap 'docker rm -f "$identity_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$identity_container:/app/WeKnora" /tmp/image-WeKnora
          docker cp "$identity_container:/usr/local/bin/migrate" /tmp/image-migrate
          go version -m /tmp/image-WeKnora | tee /tmp/image-server-build-info.txt
          grep -F "go${GO_VERSION}" /tmp/image-server-build-info.txt
          grep -F -- '-tags=anydoc' /tmp/image-server-build-info.txt
          grep -F 'CGO_ENABLED=1' /tmp/image-server-build-info.txt
          go version -m /tmp/image-migrate | tee /tmp/migrate-build-info.txt
          grep -F 'github.com/golang-migrate/migrate/v4' /tmp/migrate-build-info.txt
          grep -F "v${MIGRATE_VERSION}" /tmp/migrate-build-info.txt
          docker run --rm --entrypoint /home/appuser/.local/bin/uv "$IMAGE" --version \
            | tee /tmp/uv-version.txt
          grep -F "uv ${UV_VERSION} " /tmp/uv-version.txt
          echo "APP_IMAGE_IDENTITY_GATE=PASS"

      - name: Verify migration artifact identity
        run: |
          set -euo pipefail
          container=$(docker create "$IMAGE")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          mkdir -p /tmp/image-root
          docker cp "$container:/app/migrations" /tmp/image-root/migrations
          (cd source/migrations && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/source-migrations.sha256
          (cd /tmp/image-root/migrations && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/image-migrations.sha256
          diff -u /tmp/source-migrations.sha256 /tmp/image-migrations.sha256
          test "$(jq -r '.dialects.versioned.existing_knowhub_baseline' source/migrations/migration-map.json)" = 3000
          test "$(jq -r '.dialects.versioned.current_latest' source/migrations/migration-map.json)" = 3022
          test "$(jq -r '.dialects.sqlite.current_latest' source/migrations/migration-map.json)" = 3020
          echo "IMAGE_MIGRATION_GATE=PASS"

      - name: Run parser smoke in production runtime
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE}-validation" \
            -test.v -test.run 'TestConvertDocxWithEmbeddedImage|TestConvertAllBenchmarkFormats|TestCombinedConversionPreservesModelAndMarkdown|TestConvertPDFReportsScannedPages'
          echo "DOCX_RUNTIME_GATE=PASS"
          echo "PPTX_RUNTIME_GATE=PASS"
          echo "XLSX_RUNTIME_GATE=PASS"
          echo "PDF_RUNTIME_GATE=PASS"
          echo "ASSET_LINK_RUNTIME_GATE=PASS"

      - name: Create baseline evidence
        run: |
          set -euo pipefail
          docker save -o /tmp/knowhub-app-anydoc-0.2.4-baseline.tar "$IMAGE"
          dockerfile_sha=$(sha256sum baseline/docker/Dockerfile.app.knowhub-release | awk '{print $1}')
          archive_sha=$(sha256sum /tmp/knowhub-app-anydoc-0.2.4-baseline.tar | awk '{print $1}')
          image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          image_arch=$(docker image inspect --format '{{.Architecture}}' "$IMAGE")
          image_os=$(docker image inspect --format '{{.Os}}' "$IMAGE")
          duckdb_hashes=$(docker run --rm --entrypoint /bin/sh "$IMAGE" -c \
            "find /home/appuser/.duckdb -type f -exec sha256sum {} + | sort" | tr '\n' ';')
          cat > baseline-evidence.txt <<EOF
          SOURCE_SHA=$SOURCE_SHA
          GO_VERSION=$GO_VERSION
          RUST_VERSION=$RUST_VERSION
          ANYDOC_VERSION=$ANYDOC_VERSION
          ANYDOC_SHA256=$ANYDOC_SHA256
          MIGRATE_VERSION=$MIGRATE_VERSION
          UV_VERSION=$UV_VERSION
          DOCKERFILE_SHA256=$dockerfile_sha
          IMAGE_ID=$image_id
          IMAGE_ARCH=$image_arch
          IMAGE_OS=$image_os
          IMAGE_ARCHIVE_SHA256=$archive_sha
          DUCKDB_EXTENSION_SHA256=$duckdb_hashes
          CLOUD_RELEASE_BASELINE_GATE=PASS
          EOF
          cat baseline-evidence.txt

      - name: Upload baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: anydoc-0.2.4-release-baseline-evidence
          path: |
            baseline-evidence.txt
            /tmp/anydoc-file.txt
            /tmp/anydoc-symbols.txt
            /tmp/server-build-info.txt
            /tmp/image-server-build-info.txt
            /tmp/migrate-build-info.txt
            /tmp/image-inspect.json
            /tmp/source-migrations.sha256
            /tmp/image-migrations.sha256
          if-no-files-found: error
          retention-days: 30
