name: Feishu automatic service full native APP isolated qualification
on:
  push:
    branches: [ci/feishu-self-recovery-native-20261126]
    paths: [.github/workflows/feishu-automatic-native-app.yml, ci/feishu-automatic-native/**]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact final candidate source SHA (40 lowercase hex)
        required: true
      native_run_id:
        description: Successful exact-source formal Bookworm native qualification run
        required: true
permissions:
  contents: read
  actions: read
env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  DOCREADER_SHA: 6047feab2f09db44eea25425b9138973416d340e
jobs:
  full-app:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Define disposable test root
        run: echo "QUALIFICATION_ROOT=$RUNNER_TEMP/knowhub-auto-native-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          path: source
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: ci/feishu-automatic-native
          path: qualification
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DOCREADER_SHA }}
          persist-credentials: false
          path: docreader-source
      - name: Validate upstream run and runner resources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NATIVE_RUN: ${{ inputs.native_run_id }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir evidence
          python3 - <<'PY'
          import os,json,pathlib,urllib.request
          run=os.environ['NATIVE_RUN'];assert run.isdigit()
          assert len(os.environ['SOURCE_SHA'])==40 and all(c in '0123456789abcdef' for c in os.environ['SOURCE_SHA'])
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+run,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response:meta=json.load(response)
          assert meta['path']=='.github/workflows/consumer-native-build.yml' and (meta['status']!='completed' or meta['conclusion']=='success')
          mem={k:int(v.split()[0]) for k,v in (x.split(':',1) for x in pathlib.Path('/proc/meminfo').read_text().splitlines())}
          stat=os.statvfs(os.environ['RUNNER_TEMP']);assert stat.f_bavail*stat.f_frsize>20*1024**3
          assert mem['MemAvailable']>5*1024**2
          pathlib.Path('evidence/native-upstream.json').write_text(json.dumps({'run_id':int(run),'workflow_sha':meta['head_sha'],'conclusion':meta['conclusion'],'source_sha':os.environ['SOURCE_SHA'],'available_memory_kib':mem['MemAvailable'],'available_disk_bytes':stat.f_bavail*stat.f_frsize}))
          PY
          sudo apt-get update -qq
      - uses: docker/setup-buildx-action@v4
      - name: Build real DocReader and pull isolated dependencies
        run: |
          set -euo pipefail
          docker pull paradedb/paradedb@sha256:af585013f97f622715de01e48d00558f7edf17055d7b40deafc9f98ca8d99a56
          docker pull redis:7.0.15
          docker pull clamav/clamav:stable
          test "$(git -C docreader-source rev-parse HEAD)" = "$DOCREADER_SHA"
          docker buildx build --load --platform linux/amd64 \
            -f docreader-source/docker/Dockerfile.docreader \
            --label org.opencontainers.image.revision="$DOCREADER_SHA" \
            --cache-from type=gha,scope=consumer-native-docreader \
            --cache-to type=gha,scope=consumer-native-docreader,mode=max \
            -t "knowhub-auto-native-docreader:$DOCREADER_SHA" docreader-source
          docker buildx stop
      - name: Wait for successful final native artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NATIVE_RUN: ${{ inputs.native_run_id }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib,urllib.request,time
          deadline=time.monotonic()+1800
          while time.monotonic()<deadline:
            request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['NATIVE_RUN'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(request,timeout=30) as response:meta=json.load(response)
            assert meta['path']=='.github/workflows/consumer-native-build.yml'
            if meta['status']=='completed':
              assert meta['conclusion']=='success','Final native build did not pass'
              pathlib.Path('evidence/native-upstream.json').write_text(json.dumps({'run_id':meta['id'],'workflow_sha':meta['head_sha'],'conclusion':meta['conclusion'],'source_sha':os.environ['SOURCE_SHA']}))
              break
            print(json.dumps({'native_upstream_status':meta['status'],'source_sha':os.environ['SOURCE_SHA']}),flush=True)
            time.sleep(30)
          else:raise RuntimeError('Final native artifact not ready within bounded wait')
          PY
      - uses: actions/download-artifact@v5
        with:
          name: consumer-native-${{ env.SOURCE_SHA }}
          path: native
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.native_run_id }}
      - name: Load and verify exact native APP image
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,hashlib,os
          root=pathlib.Path('native');assert (root/'source-sha.txt').read_text().strip()==os.environ['SOURCE_SHA']
          digest=hashlib.file_digest((root/'app-image.tar.gz').open('rb'),'sha256').hexdigest()
          assert digest==(root/'archive.sha256').read_text().split()[0]
          import json
          evidence=pathlib.Path('evidence/native-upstream.json');record=json.loads(evidence.read_text())
          record.update({'app_archive_sha256':digest,'app_image_id':(root/'image-id.txt').read_text().strip(),'source_tree':(root/'source-tree.txt').read_text().strip()})
          evidence.write_text(json.dumps(record))
          PY
          docker load -i native/app-image.tar.gz
          image="$(cat native/image-id.txt)"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$SOURCE_SHA"
          rm native/app-image.tar.gz
      - name: Prepare fresh identities and isolated complete stack
        run: |
          set -euo pipefail
          python3 qualification/ci/feishu-automatic-native/prepare.py "$(cat native/image-id.txt)"
          cp qualification/ci/feishu-automatic-native/model-fixture.py "$QUALIFICATION_ROOT/model-fixture.py"
          chmod 644 "$QUALIFICATION_ROOT/model-fixture.py"
          python3 - <<'PY'
          import pathlib,os,zipfile
          root=pathlib.Path(os.environ['QUALIFICATION_ROOT'])
          with zipfile.ZipFile(root/'normal.docx','w',zipfile.ZIP_DEFLATED) as z:
            z.writestr('[Content_Types].xml','<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>')
            z.writestr('_rels/.rels','<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>')
            z.writestr('word/document.xml','<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>Nativecanary qualification. Real native Office parsing preserves isolated worker safety and indexed source retrieval.</w:t></w:r></w:p></w:body></w:document>')
          PY
          docker compose -p "knowhub-auto-native-$GITHUB_RUN_ID" -f "$QUALIFICATION_ROOT/compose.json" config --quiet
          docker compose -p "knowhub-auto-native-$GITHUB_RUN_ID" -f "$QUALIFICATION_ROOT/compose.json" up -d --no-build --pull never --wait --wait-timeout 300
      - name: Diagnose permitted real HTTP client transports
        run: python3 qualification/ci/feishu-automatic-native/network_probe.py
      - name: Real authenticated APP MCP Wiki and worker qualification
        run: |
          set -euo pipefail
          python3 qualification/ci/feishu-automatic-native/acceptance.py
          python3 qualification/ci/feishu-automatic-native/probe.py
      - name: Safe startup classification
        if: always()
        run: python3 qualification/ci/feishu-automatic-native/startup_diagnostics.py
      - name: Confirm safe startup classifications
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import json,pathlib
          report=json.loads(pathlib.Path('evidence/startup-diagnostics.json').read_text())
          assert 'collector_class' not in report and not report.get('panic_present')
          assert not report.get('startup_classes'), 'Unresolved native startup classification'
          counts=report.get('permission_denial_classification',{})
          assert counts.get('operating_system_denial',0)==counts.get('unknown_denial',0)==0
          assert pathlib.Path('evidence/full-app-report.json').exists(), 'Full APP qualification incomplete'
          PY
      - name: Whitelist safe evidence only
        if: always()
        env:
          FINAL_JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json,pathlib,os
          out=pathlib.Path('evidence');out.mkdir(exist_ok=True)
          (out/'workflow-result.json').write_text(json.dumps({'source_sha':os.environ['SOURCE_SHA'],'status_before_evidence':os.environ['FINAL_JOB_STATUS'],'production_changes':False,'private_config_or_accounts_uploaded':False,'platform_signature_dependency':False,'remote_feishu_publication':'NOT_RUN'}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-native-full-app-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/full-app-report.json
            evidence/full-app-failure.json
            evidence/acceptance-failure.json
            evidence/dependency-images.json
            evidence/startup-diagnostics.json
            evidence/network-probe.json
            evidence/dictionary-assets.json
            evidence/native-upstream.json
            evidence/workflow-result.json
          if-no-files-found: error
          retention-days: 14
