name: Production Release Provenance Gate

on:
  pull_request:
    paths:
      - scripts/ops/verify_release_provenance.py
      - scripts/ops/test_verify_release_provenance.py
      - .github/workflows/production-release-provenance.yml
  push:
    branches: [main]
    paths:
      - scripts/ops/verify_release_provenance.py
      - scripts/ops/test_verify_release_provenance.py
      - .github/workflows/production-release-provenance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Reject stale main and mismatched paired images
        run: python -m unittest discover -s scripts/ops -p test_verify_release_provenance.py -v

  integration-safety:
    if: >-
      github.ref == 'refs/heads/integration/production-main-closeout-20261103' ||
      github.head_ref == 'integration/production-main-closeout-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: paradedb/paradedb:v0.22.2-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: closeout_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d closeout_test'
          --health-interval 10s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd 'redis-cli ping'
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SYNC_EXECUTION_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/closeout_test?sslmode=disable
      REQUIRE_SYNC_EXECUTION_POSTGRES: '1'
      FEISHU_SYNC_SAFETY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache: true
      - name: Bind exact candidate and isolated Redis
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          alias="knowhub-recovery-redis-${SOURCE_SHA:0:12}"
          echo "127.0.0.1 $alias" | sudo tee -a /etc/hosts >/dev/null
          echo "FEISHU_RECOVERY_REAL_REDIS_ADDR=$alias:6379" >> "$GITHUB_ENV"
      - name: Safety, source authority, task fences, deletion and personal MCP
        shell: bash
        run: |
          set -euo pipefail
          go test -json -race -p 1 -tags sqlite_fts5 \
            ./internal/feishusafety ./internal/feishusynccontrol \
            ./internal/application/repository ./internal/application/service \
            ./internal/handler ./internal/middleware \
            -run 'TestProtectedKBDeletion|TestKBDeletionMetadata|TestProcessKBDeleteProtected|TestApprovedSourcesRetainHistoricalQueueAndCheckLiveAuthority|TestSteadySourcesAcrossThreeTenantsRetainQueueAndRenewOnlyHealth|TestSteadyAuthorityPostgresCrossTenantAndPrivateOwner|TestSteadySourcesOutboundRequiresExactTenantAndCurrentClaim|TestSteadyInflightSourceRevocationDoesNotTripOtherSources|TestRecoveryHTTPAuthorizationBeforePlanOrExecution|TestPersonalRecoveryExactPreflightClaimCAS|TestPersonalRecoveryExactExecutionWriteFence|TestExactPublishedDetailChecksSQLBoundaries|TestPortalM6DynamicScopeAndWithdrawal|TestUserMCPCredentialResponsesNeverExposeStoredSecret|TestUserMCPAuditDetailsContainHintButNoSecret' \
            -count=1 -timeout=12m | tee closeout-safety.jsonl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: closeout-safety-${{ env.SOURCE_SHA }}-${{ github.event_name }}
          path: closeout-safety.jsonl
          retention-days: 90
