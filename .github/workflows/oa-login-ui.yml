name: OA Login UI
on:
  push:
    branches: [feature/knowhub-sourceid-oidc]
    paths: ["frontend/**", ".github/workflows/oa-login-ui.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      GOMAXPROCS: "2"
      RAYON_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm test -- src/views/auth/oidcLoginPresentation.test.ts src/views/auth/registrationPolicy.test.ts src/utils/authRedirect.test.ts src/utils/authRefresh.test.ts src/utils/authLandingContracts.test.ts src/utils/oidcCallbackEntry.test.ts src/i18n/localeKeyAudit.test.ts
      - run: npx playwright install --with-deps chromium
      - run: node tests/oa-login/oa-login-ui-baseline.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: oa-login-ui-${{ github.sha }}
          path: docs/qa/oa-login-ui-release-20261015/
          retention-days: 14
