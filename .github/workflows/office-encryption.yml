name: Office encryption validation
on:
  workflow_dispatch:
  push:
    branches: [ci/office-encryption-validation]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: office-encryption-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: office-disposable-only
          POSTGRES_DB: feishu_atomic_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d feishu_atomic_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
      SYNC_EXECUTION_POSTGRES_DSN: postgres://postgres:office-disposable-only@localhost:5432/feishu_atomic_test?sslmode=disable
      REQUIRE_SYNC_EXECUTION_POSTGRES: '1'
      FEISHU_P0_REDIS_ADDR: 127.0.0.1:6379
      FEISHU_SAFETY_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check format
        run: |
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source-sha.txt
          git diff --check
      - name: Detector regression and fuzz
        run: |
          go test -json -count=1 ./internal/officeguard | tee evidence/detector.jsonl
          go test ./internal/officeguard -fuzz FuzzDetect -fuzztime 15s -parallel 2 | tee evidence/fuzz.txt
      - name: Upload admission and security regression
        run: |
          go test -json -tags sqlite_fts5 -p 2 -count=1 \
          ./internal/application/access ./internal/application/service \
          ./internal/mcpserver ./internal/handler ./internal/handler/session \
          ./internal/datasource/connector/feishu/core \
          -run 'TestOffice|TestPersonalContent|TestPersonalFile|TestClamdScanner|TestCreateKnowledgeFromFile|TestReplaceKnowledgeFile|TestIsolatedPersonal|TestTemporaryDocument|TestAttachment|TestIngestItem|TestFeishuDocument|TestDataSource|TestFeishuPersonalRecoveryPostgres|TestMVPFirstCreate' \
          -timeout 25m | tee evidence/business.jsonl
          python3 scripts/ci/office_encryption_results.py evidence/business.jsonl
      - name: Complete permission and MCP isolation regression
        run: |
          go test -json -tags sqlite_fts5 -p 2 -count=1 \
            ./internal/application/access ./internal/middleware ./internal/mcpserver \
            -timeout 15m | tee evidence/permissions.jsonl
      - name: Race regression
        run: |
          go test -json -race -tags sqlite_fts5 -p 2 -count=1 \
          ./internal/officeguard ./internal/application/service ./internal/mcpserver \
          -run 'TestOffice|TestPersonalContent|TestFixtures|TestVendorFixtures' \
          -timeout 15m | tee evidence/race.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-linux-${{ github.sha }}
          path: evidence/
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend dependencies
        run: npm ci
      - name: Browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Frontend and browser regression
        run: |
          mkdir -p evidence
          npm test -- --test-concurrency=2 | tee evidence/tests.txt
          node tests/office-encryption/browser.mjs | tee evidence/browser.txt
          npm run type-check | tee evidence/types.txt
          npm run build | tee evidence/build.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-frontend-${{ github.sha }}
          path: frontend/evidence/
