name: SourceID OIDC validation

on:
  push:
    branches: [feature/knowhub-sourceid-oidc]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - "frontend/**"
      - "config/**"
      - ".env.example"
      - "docker-compose.yml"
      - ".github/workflows/sourceid-oidc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sourceid-${{ github.ref }}
  cancel-in-progress: true

env:
  LOG_FORMAT: ""
  CGO_ENABLED: "1"
  GOTOOLCHAIN: local

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true
      - name: Record identity
        run: |
          mkdir -p sourceid-results
          git rev-parse HEAD > sourceid-results/head.txt
          go version > sourceid-results/environment.txt
          gcc --version >> sourceid-results/environment.txt
          git diff --check
          mapfile -t changed_go < <(git diff --name-only ac7dbe5e2607af5ab4e74c062137e0cad48d0e50..HEAD -- '*.go')
          test -z "$(gofmt -l "${changed_go[@]}")"
      - name: SourceID and authentication tests with race detection
        shell: bash
        run: |
          set -euo pipefail
          go test -race -json -count=1 ./cmd/sourceid-enroll ./cmd/sourceid-probe ./internal/sourceid ./internal/application/repository ./internal/application/service ./internal/handler ./internal/config ./internal/middleware ./internal/utils -run 'SourceID|Enrollment|OIDC|AuthToken|SwitchTenant|Login|Logout|GenerateTokens|ValidateToken|RefreshToken' | tee sourceid-results/focused.jsonl
      - name: Authentication and MCP regression
        shell: bash
        run: |
          set -euo pipefail
          go vet ./cmd/sourceid-enroll ./cmd/sourceid-probe ./internal/sourceid ./internal/application/repository ./internal/application/service ./internal/handler ./internal/config ./internal/middleware
          go test -json -count=1 ./internal/application/repository ./internal/application/service ./internal/handler ./internal/config ./internal/middleware ./internal/utils ./internal/mcp ./internal/mcpserver | tee sourceid-results/regression.jsonl
      - name: Build server and reviewed enrollment utility
        run: |
          go build -o /tmp/knowhub-sourceid-server ./cmd/server
          go build -o /tmp/sourceid-enroll ./cmd/sourceid-enroll
          go build -o /tmp/sourceid-probe ./cmd/sourceid-probe
      - uses: actions/upload-artifact@v6
        with:
          name: sourceid-probe-linux-${{ github.sha }}
          path: /tmp/sourceid-probe
          retention-days: 7
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sourceid-linux-${{ github.sha }}
          path: sourceid-results

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sourceid_mock
          POSTGRES_PASSWORD: sourceid_mock
          POSTGRES_DB: sourceid_mock
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sourceid_mock -d sourceid_mock"
          --health-interval 10s --health-timeout 5s --health-retries 6
    env:
      SOURCEID_TEST_POSTGRES_DSN: postgres://sourceid_mock:sourceid_mock@localhost:5432/sourceid_mock?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true
      - name: PostgreSQL migration and durable session tests
        run: go test -race -v -count=1 ./internal/application/repository -run SourceIDPostgres

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm test -- src/utils/authRedirect.test.ts src/utils/authRefresh.test.ts src/utils/authLandingContracts.test.ts
      - run: npm run build
