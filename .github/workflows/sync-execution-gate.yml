name: Datasource Sync Execution Gate

on:
  push:
    branches: [fix/feishu-sync-resilience]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-execution-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.8"
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  GOPROXY: https://proxy.golang.org,direct
  LOG_FORMAT: ""

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.head_ref == 'fix/feishu-sync-resilience'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Record exact validation identity and format
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "VALIDATION_HEAD_SHA=$SOURCE_SHA"
          test -z "$(gofmt -l internal/application/repository/datasource*.go internal/application/service/datasource*.go internal/datasource/*.go internal/types/sync_execution.go internal/testutil/syncdb/*.go internal/container/*sync*go)"
          git diff --check
      - name: Linux full vet and tests
        run: |
          set -euo pipefail
          bash -n scripts/check-app-migration-identity.sh scripts/check-app-migration-identity_test.sh
          bash scripts/check-app-migration-identity_test.sh
          mapfile -t packages < <(go list ./... | grep -v '/docreader/')
          go vet "${packages[@]}"
          go test "${packages[@]}"

  postgres:
    if: github.event_name != 'pull_request' || github.head_ref == 'fix/feishu-sync-resilience'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: paradedb/paradedb:v0.22.2-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sync_gate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sync_gate"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      SYNC_EXECUTION_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/sync_gate?sslmode=disable
      REQUIRE_SYNC_EXECUTION_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Record exact PostgreSQL source identity
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "VALIDATION_HEAD_SHA=$SOURCE_SHA"
      - name: Real PostgreSQL admission, claim, fencing and startup recovery x50
        run: |
          go test ./internal/application/repository ./internal/application/service ./internal/datasource ./internal/container \
            -run 'TestSync(Execution|Service|Scheduler|Recovery)Postgres$' -count=50 -timeout=20m
      - name: Repeat real PostgreSQL concurrency x100
        run: |
          go test ./internal/application/repository ./internal/application/service ./internal/datasource ./internal/container \
            -run 'TestSync(Execution|Service|Scheduler|Recovery)Postgres$' -count=100 -timeout=20m
      - name: Real PostgreSQL race
        run: |
          go test -race ./internal/application/repository ./internal/application/service ./internal/datasource ./internal/container \
            -run 'TestSync(Execution|Service|Scheduler|Recovery)Postgres$' -count=1 -timeout=20m

  race:
    if: github.event_name != 'pull_request' || github.head_ref == 'fix/feishu-sync-resilience'
    name: Complete resilience race (${{ matrix.repetition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        repetition: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Record exact race source and attribution environment
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "VALIDATION_HEAD_SHA=$SOURCE_SHA ImageOS=$ImageOS ImageVersion=$ImageVersion"
          go version
          test "$(go env CGO_ENABLED)" = 1
          test "$ImageVersion" = 20260927.320.1
          sha256sum go.mod go.sum
      - name: SQLite concurrency x50
        run: |
          go test ./internal/application/repository ./internal/application/service ./internal/datasource ./internal/container \
            -run 'TestSync(Execution|Service|Scheduler|Recovery)SQLite$' -count=50 -timeout=20m
      - name: Linux race and TLS, SSRF, Feishu credential regressions
        run: |
          go test -race ./internal/application/repository ./internal/application/service ./internal/datasource \
            ./internal/datasource/connector/feishu/... ./internal/utils ./internal/container -count=1 -timeout=25m
