name: Feishu isolated structured DocReader image
on:
  push:
    branches: [feature/knowhub-feishu-access-v2]
    paths: [.github/workflows/feishu-docreader-isolated.yml]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source commit to package
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || 'b11a0b7f1d89cf8ec640bb4eb6c61322f1d47e37' }}
          persist-credentials: false
      - name: Validate pinned source
        env:
          SOURCE_SHA: ${{ inputs.source_sha || 'b11a0b7f1d89cf8ec640bb4eb6c61322f1d47e37' }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: docker/setup-buildx-action@v4
      - name: Build structured parser without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.docreader
          platforms: linux/amd64
          push: false
          load: true
          tags: knowhub-feishu-v2/docreader:${{ inputs.source_sha || 'b11a0b7f1d89cf8ec640bb4eb6c61322f1d47e37' }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_sha || 'b11a0b7f1d89cf8ec640bb4eb6c61322f1d47e37' }}
            knowhub.environment=isolated-test
          cache-from: type=gha,scope=verify-docreader-amd64
          cache-to: type=gha,scope=verify-docreader-amd64,mode=max
      - name: Verify structured spreadsheet behavior
        env:
          SOURCE_SHA: ${{ inputs.source_sha || 'b11a0b7f1d89cf8ec640bb4eb6c61322f1d47e37' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/docreader-package"
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/testdata:/app/testdata:ro" \
            --entrypoint /app/.venv/bin/python \
            "knowhub-feishu-v2/docreader:$SOURCE_SHA" -m unittest \
              docreader.tests.test_excel_parser \
              docreader.tests.test_spreadsheet_schema \
              docreader.tests.test_xlsx_styles_repair -v \
            2>&1 | tee "$RUNNER_TEMP/docreader-package/structured-tests.log"
          docker image inspect "knowhub-feishu-v2/docreader:$SOURCE_SHA" \
            --format '{{.Id}}' > "$RUNNER_TEMP/docreader-package/image.id"
          docker save "knowhub-feishu-v2/docreader:$SOURCE_SHA" | gzip -1 \
            > "$RUNNER_TEMP/docreader-package/docreader-image.tar.gz"
      - name: Record image provenance
        env:
          SOURCE_SHA: ${{ inputs.source_sha || 'b11a0b7f1d89cf8ec640bb4eb6c61322f1d47e37' }}
          OUTPUT: ${{ runner.temp }}/docreader-package
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['OUTPUT'])
          archive=root/'docreader-image.tar.gz'
          digest=hashlib.sha256()
          with archive.open('rb') as f:
              for part in iter(lambda:f.read(1024*1024),b''):digest.update(part)
          manifest={'source_sha':os.environ['SOURCE_SHA'],'target':'linux/amd64',
                    'qualification':'source_pinned_isolated_structured_docreader',
                    'image_id':(root/'image.id').read_text().strip(),
                    'archive_sha256':digest.hexdigest(),'archive_bytes':archive.stat().st_size,
                    'dockerfile_sha256':hashlib.sha256(pathlib.Path('docker/Dockerfile.docreader').read_bytes()).hexdigest()}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: feishu-structured-docreader-${{ inputs.source_sha || 'b11a0b7f1d89cf8ec640bb4eb6c61322f1d47e37' }}
          path: ${{ runner.temp }}/docreader-package/
          compression-level: 0
          retention-days: 14
