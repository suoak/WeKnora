name: Portal Final Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  portal-contracts:
    name: Portal contracts, RBAC, race, and branding
    if: github.repository == 'suoak/WeKnora'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Run Portal backend contracts
        run: |
          go test \
            ./internal/application/service \
            ./internal/application/repository \
            ./internal/handler \
            ./internal/router \
            ./internal/database \
            -run 'Portal|KnowledgePortal' \
            -count=1

      - name: Validate migration governance manifest and SQLite upgrade paths
        run: |
          go test ./internal/database \
            -run 'Test(MigrationGovernanceManifest|MigrationRunnerSupportsSparseHighVersions|MigrationNumbersAreUniqueAndPaired|SQLiteMigrationGovernanceFreshAndExistingKnowHubConverge)$' \
            -count=1

      - name: Run access approval race test
        run: |
          go test -race ./internal/application/service \
            -run '^TestApproveAccessRequestConcurrentIsIdempotent$' \
            -count=10

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run Portal, redirect, locale, and KnowHub branding contracts
        working-directory: frontend
        run: |
          npx tsx --test \
            src/config/branding.test.ts \
            src/views/portal/portalContracts.test.ts \
            src/stores/portalState.test.ts \
            src/i18n/localeKeyAudit.test.ts \
            src/utils/authLandingContracts.test.ts \
            src/utils/authRedirect.test.ts \
            src/utils/authRefresh.test.ts

      - name: Reject conflict markers and committed build artifacts
        shell: bash
        run: |
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- .; then
            echo 'Git conflict markers are committed.'
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(node_modules|dist|\.tmp-migration-gate)(/|$)'; then
            echo 'Generated or temporary artifacts are committed.'
            exit 1
          fi
          git diff --check

  m1-linux-backend:
    name: M1 Linux backend and MCP compatibility
    if: github.repository == 'suoak/WeKnora'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsqlite3-dev

      - name: Download Go modules
        run: go mod download

      - name: Run complete internal backend suite
        run: go test -p 1 ./internal/... -count=1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Python MCP tests when dependency is available
        shell: bash
        run: |
          if python -c 'import mcp' 2>/dev/null; then
            (cd mcp-server && python -m unittest test_mcp_transports.py)
          else
            echo 'Python MCP tests not run: the mcp dependency is not installed in this CI environment.'
          fi

  postgres-migrations:
    name: PostgreSQL fresh and existing KnowHub upgrade governance
    if: github.repository == 'suoak/WeKnora'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: paradedb/paradedb:v0.22.2-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres
      CLEAN_DB_URL: postgres://postgres:postgres@localhost:5432/portal_clean?sslmode=disable
      UPGRADE_DB_URL: postgres://postgres:postgres@localhost:5432/migration_upgrade?sslmode=disable
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install migration CLI
        run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

      - name: Read the governed migration upgrade window
        shell: bash
        run: |
          set -euo pipefail
          baseline_version="$(jq -er '.dialects.versioned.existing_knowhub_baseline' migrations/migration-map.json)"
          latest_version="$(jq -er '.dialects.versioned.current_latest' migrations/migration-map.json)"
          test "$baseline_version" -lt "$latest_version"
          echo "KNOWHUB_BASELINE_VERSION=$baseline_version" >> "$GITHUB_ENV"
          echo "LATEST_VERSION=$latest_version" >> "$GITHUB_ENV"
          echo "Testing existing KnowHub migration upgrade ${baseline_version} -> ${latest_version}"

      - name: Create isolated test databases
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE portal_clean TEMPLATE template0;'
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE migration_upgrade TEMPLATE template0;'

      - name: Validate fresh migration and idempotency
        shell: bash
        run: |
          set -euo pipefail
          migrate_bin="$(go env GOPATH)/bin/migrate"
          "$migrate_bin" -path migrations/versioned -database "$CLEAN_DB_URL" up
          "$migrate_bin" -path migrations/versioned -database "$CLEAN_DB_URL" up

          psql "$CLEAN_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.tenant_portal_configs') IS NULL
               OR to_regclass('public.tenant_portal_stages') IS NULL
               OR to_regclass('public.tenant_access_requests') IS NULL THEN
              RAISE EXCEPTION 'Portal tables are missing after clean migration';
            END IF;
          END $$;
          SQL

          current_version=$("$migrate_bin" -path migrations/versioned -database "$CLEAN_DB_URL" version 2>&1)
          test "$current_version" = "$LATEST_VERSION"

      - name: Validate existing KnowHub upgrade and preserve sentinel data
        shell: bash
        run: |
          set -euo pipefail
          migrate_bin="$(go env GOPATH)/bin/migrate"
          "$migrate_bin" -path migrations/versioned -database "$UPGRADE_DB_URL" goto "$KNOWHUB_BASELINE_VERSION"
          psql "$UPGRADE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO tenants (id, name, business, status)
          VALUES (91001, 'portal-upgrade-sentinel', 'ci', 'active');
          INSERT INTO users (id, username, email, password_hash, is_active)
          VALUES ('m1-legacy-owner', 'm1-legacy-owner', 'm1-legacy@example.invalid', 'synthetic-hash', true);
          INSERT INTO tenant_api_keys (
            scope_type, owner_user_id, name, key_hash, api_key,
            full_access, capabilities
          ) VALUES (
            'user_mcp', 'm1-legacy-owner', 'm1-legacy-credential',
            '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef',
            'synthetic-legacy-secret', false, '["retrieve","chat"]'::jsonb
          );
          SQL
          "$migrate_bin" -path migrations/versioned -database "$UPGRADE_DB_URL" up
          current_version=$("$migrate_bin" -path migrations/versioned -database "$UPGRADE_DB_URL" version 2>&1)
          test "$current_version" = "$LATEST_VERSION"
          psql "$UPGRADE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM tenants
              WHERE id = 91001 AND name = 'portal-upgrade-sentinel'
            ) THEN
              RAISE EXCEPTION 'Pre-existing tenant data was not preserved';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM tenant_api_keys
              WHERE name = 'm1-legacy-credential'
                AND client_type = 'generic'
                AND token_hint = ''
                AND api_key = 'synthetic-legacy-secret'
            ) THEN
              RAISE EXCEPTION 'Legacy user_mcp credential compatibility was not preserved';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_constraint con
              JOIN pg_class rel ON rel.oid = con.conrelid
              WHERE rel.relname = 'tenant_api_keys'
                AND pg_get_constraintdef(con.oid) ILIKE '%client_type%'
            ) THEN
              RAISE EXCEPTION 'client_type must not use a database enum-style CHECK';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'tenant_api_keys'
                AND column_name = 'client_type'
                AND is_nullable = 'NO'
                AND column_default LIKE '%generic%'
            ) OR NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'tenant_api_keys'
                AND column_name = 'token_hint'
                AND is_nullable = 'NO'
            ) THEN
              RAISE EXCEPTION 'M1 credential lifecycle columns are invalid';
            END IF;
            IF EXISTS (SELECT 1 FROM schema_migrations WHERE dirty) THEN
              RAISE EXCEPTION 'Migration state is dirty';
            END IF;
          END $$;
          SQL

      - name: Compare fresh and upgraded PostgreSQL schema fingerprints
        shell: bash
        run: |
          set -euo pipefail
          normalize_schema() {
            psql "$1" -X -A -t -F $'\t' -v ON_ERROR_STOP=1 <<'SQL'
          WITH schema_objects AS (
            SELECT 'relation' AS kind, c.relname AS object_name,
                   c.relkind::text AS object_subtype, '' AS definition
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public' AND c.relkind IN ('r', 'p', 'S', 'v', 'm')
            UNION ALL
            SELECT 'column', c.relname || '.' || a.attname, a.attnum::text,
                   format_type(a.atttypid, a.atttypmod) || '|' || a.attnotnull::text || '|' ||
                   a.attidentity::text || '|' || COALESCE(pg_get_expr(d.adbin, d.adrelid), '')
            FROM pg_attribute a
            JOIN pg_class c ON c.oid = a.attrelid
            JOIN pg_namespace n ON n.oid = c.relnamespace
            LEFT JOIN pg_attrdef d ON d.adrelid = a.attrelid AND d.adnum = a.attnum
            WHERE n.nspname = 'public' AND a.attnum > 0 AND NOT a.attisdropped
              AND c.relkind IN ('r', 'p', 'v', 'm')
            UNION ALL
            SELECT 'constraint', c.relname || '.' || con.conname, con.contype::text,
                   pg_get_constraintdef(con.oid, true)
            FROM pg_constraint con
            JOIN pg_class c ON c.oid = con.conrelid
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public'
            UNION ALL
            SELECT 'index', tbl.relname, i.indisunique::text,
                   regexp_replace(
                     pg_get_indexdef(i.indexrelid),
                     '^CREATE (UNIQUE )?INDEX [^ ]+ ',
                     'CREATE \1INDEX '
                   )
            FROM pg_index i
            JOIN pg_class tbl ON tbl.oid = i.indrelid
            JOIN pg_class idx ON idx.oid = i.indexrelid
            JOIN pg_namespace n ON n.oid = tbl.relnamespace
            WHERE n.nspname = 'public'
            UNION ALL
            SELECT 'trigger', c.relname || '.' || t.tgname, '', pg_get_triggerdef(t.oid, true)
            FROM pg_trigger t
            JOIN pg_class c ON c.oid = t.tgrelid
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public' AND NOT t.tgisinternal
            UNION ALL
            SELECT 'enum', typ.typname || '.' || enum.enumlabel, enum.enumsortorder::text, ''
            FROM pg_type typ
            JOIN pg_namespace n ON n.oid = typ.typnamespace
            JOIN pg_enum enum ON enum.enumtypid = typ.oid
            WHERE n.nspname = 'public'
          )
          SELECT kind, object_name, object_subtype, definition
          FROM schema_objects
          ORDER BY kind, object_name, object_subtype, definition;
          SQL
          }
          normalize_schema "$CLEAN_DB_URL" > "$RUNNER_TEMP/clean-schema.sql"
          normalize_schema "$UPGRADE_DB_URL" > "$RUNNER_TEMP/upgrade-schema.sql"
          clean_fingerprint="$(sha256sum "$RUNNER_TEMP/clean-schema.sql" | awk '{print $1}')"
          upgrade_fingerprint="$(sha256sum "$RUNNER_TEMP/upgrade-schema.sql" | awk '{print $1}')"
          echo "Fresh schema fingerprint:    $clean_fingerprint"
          echo "KnowHub schema fingerprint:  $upgrade_fingerprint"
          diff -u "$RUNNER_TEMP/clean-schema.sql" "$RUNNER_TEMP/upgrade-schema.sql"
          test "$clean_fingerprint" = "$upgrade_fingerprint"

      - name: Validate Usage Governance PostgreSQL aggregation
        env:
          USAGE_ANALYTICS_POSTGRES_DSN: ${{ env.CLEAN_DB_URL }}
        run: go test -v ./internal/application/repository -run '^TestUsageGovernance(PostgresAggregation|SQLiteExplain)$' -count=1

      - name: Validate Portal constraints and foreign-key actions
        shell: bash
        run: |
          psql "$UPGRADE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO organizations (id, name, owner_id, owner_tenant_id)
          VALUES ('portal-ci-org', 'Portal CI Org', 'portal-ci-owner', 91001);

          INSERT INTO tenant_portal_configs (
            tenant_id, status, display_name, category,
            interaction_organization_id, created_by, updated_by
          ) VALUES (
            91001, 'published', 'Portal CI', 'hardware',
            'portal-ci-org', 'portal-ci-owner', 'portal-ci-owner'
          );

          INSERT INTO tenant_portal_stages (tenant_id, stage_key, display_order)
          VALUES
            (91001, 'concept_market', 1),
            (91001, 'public_knowledge', 2);

          INSERT INTO tenant_access_requests (
            id, tenant_id, applicant_user_id, reason
          ) VALUES (
            'portal-ci-request-1', 91001, 'portal-ci-applicant', 'CI request'
          );

          DO $$
          BEGIN
            IF (SELECT data_type
                FROM information_schema.columns
                WHERE table_schema = 'public'
                  AND table_name = 'tenant_portal_stages'
                  AND column_name = 'stage_key') <> 'character varying' THEN
              RAISE EXCEPTION 'stage_key must remain VARCHAR';
            END IF;

            BEGIN
              INSERT INTO tenant_access_requests (
                id, tenant_id, applicant_user_id, reason
              ) VALUES (
                'portal-ci-request-2', 91001, 'portal-ci-applicant', 'Duplicate pending request'
              );
              RAISE EXCEPTION 'Partial unique pending constraint accepted a duplicate';
            EXCEPTION WHEN unique_violation THEN
              NULL;
            END;

            BEGIN
              INSERT INTO tenant_access_requests (
                id, tenant_id, applicant_user_id, reason, requested_role
              ) VALUES (
                'portal-ci-request-3', 91001, 'portal-ci-other', 'Role injection', 'editor'
              );
              RAISE EXCEPTION 'requested_role accepted a non-Viewer value';
            EXCEPTION WHEN check_violation THEN
              NULL;
            END;

            BEGIN
              INSERT INTO tenant_access_requests (
                id, tenant_id, applicant_user_id, reason, source
              ) VALUES (
                'portal-ci-request-4', 91001, 'portal-ci-source', 'Source injection', 'api'
              );
              RAISE EXCEPTION 'source accepted a non-Portal value';
            EXCEPTION WHEN check_violation THEN
              NULL;
            END;

            BEGIN
              UPDATE tenant_portal_configs
              SET category = 'architecture'
              WHERE tenant_id = 91001;
              RAISE EXCEPTION 'Category accepted an IPD stage key';
            EXCEPTION WHEN check_violation THEN
              NULL;
            END;
          END $$;

          DELETE FROM organizations WHERE id = 'portal-ci-org';

          DO $$
          BEGIN
            IF (SELECT interaction_organization_id
                FROM tenant_portal_configs WHERE tenant_id = 91001) IS NOT NULL THEN
              RAISE EXCEPTION 'Organization delete did not SET NULL';
            END IF;
          END $$;

          DELETE FROM tenants WHERE id = 91001;

          DO $$
          BEGIN
            IF EXISTS (SELECT 1 FROM tenant_portal_configs WHERE tenant_id = 91001)
               OR EXISTS (SELECT 1 FROM tenant_portal_stages WHERE tenant_id = 91001)
               OR EXISTS (SELECT 1 FROM tenant_access_requests WHERE tenant_id = 91001) THEN
              RAISE EXCEPTION 'Tenant delete did not CASCADE through Portal tables';
            END IF;
          END $$;
          SQL
