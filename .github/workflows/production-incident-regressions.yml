name: Production incident regressions

on:
  pull_request:
    branches: [main]
    paths:
      - "internal/application/service/sourceid*.go"
      - "internal/application/repository/sourceid*.go"
      - "internal/application/service/wiki*.go"
      - "internal/application/repository/wiki*.go"
      - ".github/workflows/production-incident-regressions.yml"
  push:
    branches: [main]
    paths:
      - "internal/application/service/sourceid*.go"
      - "internal/application/repository/sourceid*.go"
      - "internal/application/service/wiki*.go"
      - "internal/application/repository/wiki*.go"
      - ".github/workflows/production-incident-regressions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    name: Production OA identity regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-regression-only
          POSTGRES_DB: regression
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d regression"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
      SOURCEID_TEST_POSTGRES_DSN: postgres://postgres:synthetic-regression-only@127.0.0.1:5432/regression?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true
      - name: Run SQLite and PostgreSQL JIT regressions with race detection
        run: >-
          go test -race -count=1 -timeout=15m
          ./internal/application/service
          -run 'TestSourceID(JIT|PostgresJITEmailUsername)'
