name: Wiki recovery regressions

on:
  pull_request:
    branches: [main]
    paths:
      - "internal/application/service/wiki*.go"
      - "internal/application/repository/wiki*.go"
      - ".github/workflows/wiki-recovery-regressions.yml"
  push:
    branches: [main]
    paths:
      - "internal/application/service/wiki*.go"
      - "internal/application/repository/wiki*.go"
      - ".github/workflows/wiki-recovery-regressions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wiki:
    name: Wiki recovery and provenance regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true
      - name: Run Wiki recovery and provenance regressions with race detection
        run: >-
          go test -race -count=1 -timeout=15m
          ./internal/application/service ./internal/application/repository
          -run 'Wiki|PortalV1Next'
