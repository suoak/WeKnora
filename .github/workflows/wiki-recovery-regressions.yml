name: Wiki recovery regressions

on:
  pull_request:
    branches: [main]
    paths:
      - "internal/application/service/wiki*.go"
      - "internal/application/repository/wiki*.go"
      - "internal/common/wikilock/**"
      - "internal/types/wiki_page.go"
      - "cmd/wiki-regenerate/**"
      - ".github/workflows/wiki-recovery-regressions.yml"
  push:
    branches: [main]
    paths:
      - "internal/application/service/wiki*.go"
      - "internal/application/repository/wiki*.go"
      - "internal/common/wikilock/**"
      - "internal/types/wiki_page.go"
      - "cmd/wiki-regenerate/**"
      - ".github/workflows/wiki-recovery-regressions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wiki:
    name: Wiki recovery and provenance regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: paradedb/paradedb:v0.22.2-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-wiki-only
          POSTGRES_DB: wiki_regression
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wiki_regression"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true
      - name: Run Wiki recovery and provenance regressions with race detection
        run: >-
          go test -race -count=1 -timeout=15m
          ./internal/application/service ./internal/application/repository ./internal/common/wikilock
          -run 'Wiki|PortalV1Next'
      - name: Run historical regeneration and snapshot cases on real PostgreSQL
        env:
          WIKI_HISTORY_POSTGRES_DSN: postgres://postgres:synthetic-wiki-only@127.0.0.1:5432/wiki_regression?sslmode=disable
        run: >-
          go test -race -count=1 -timeout=15m ./internal/application/service
          -run '^TestWikiHistoryPostgres$'
      - name: Build operator regeneration command
        run: go build -o /tmp/wiki-regenerate ./cmd/wiki-regenerate
