name: KnowHub25 A3 PostgreSQL atomic foundation
on:
  push:
    branches: [integration/knowhub25-a3-worker-fencing-20261011]
permissions:
  contents: read
concurrency:
  group: knowhub25-a3-pg-${{ github.ref }}
  cancel-in-progress: false
jobs:
  postgres:
    if: github.repository == 'suoak/WeKnora' && github.ref == 'refs/heads/integration/knowhub25-a3-worker-fencing-20261011'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: local_fixture_only
          POSTGRES_DB: fixture
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U fixture -d fixture"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      KNOWHUB25_REQUIRE_POSTGRES: '1'
      KNOWHUB25_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=fixture password=local_fixture_only dbname=fixture sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.7'
          cache: false
      - name: Real PostgreSQL transaction and migration tests
        run: python3 .github/scripts/knowhub25_a3_pg_ci.py
