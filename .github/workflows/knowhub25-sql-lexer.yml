name: KnowHub25 data-analysis recovery and SQL contracts
on:
  push:
    branches: [integration/knowhub25-data-analysis-recovery-20261011]
permissions:
  contents: read
concurrency:
  group: knowhub25-sql-lexer
  cancel-in-progress: false
jobs:
  bounded-contracts:
    if: github.repository == 'suoak/WeKnora' && github.ref == 'refs/heads/integration/knowhub25-data-analysis-recovery-20261011'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.7'
          cache: false
      - name: Infrastructure negative tests
        run: python3 .github/scripts/knowhub25_sql_lexer_contracts.py --self-test
      - name: Complete bounded packages and raw audit
        run: python3 .github/scripts/knowhub25_sql_lexer_contracts.py
      - name: Publish fixed safe summary only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: knowhub25-sql-lexer-safe-summary
          path: ${{ runner.temp }}/knowhub25-sql-lexer-safe/summary.json
          if-no-files-found: ignore
          retention-days: 7
