name: App

# Anydoc (Rust archive + `anydoc` build tag) lives in anydoc.yml so a
# migrations-only or unrelated Go PR does not compile the parser engine.

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "**/*.go"
      - "!cli/**"
      - "!client/**"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "migrations/**"
      - "testdata/**"
      - "docker/Dockerfile.app"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "internal/textconv/data/**"
      - "scripts/*licenses.sh"
      - "scripts/check-license-bundle.sh"
      - "cmd/desktop/build/windows/installer/project.nsi"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "!cli/**"
      - "!client/**"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "migrations/**"
      - "testdata/**"
      - "docker/Dockerfile.app"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "internal/textconv/data/**"
      - "scripts/*licenses.sh"
      - "scripts/check-license-bundle.sh"
      - "cmd/desktop/build/windows/installer/project.nsi"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOPROXY: https://proxy.golang.org,direct
  # Keep tests independent of a developer machine's custom log template.
  LOG_FORMAT: ""
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  verify:
    name: Format, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # v6 defaults to go.mod for the cache key (more stable than go.sum).

      - name: Download modules
        run: go mod download

      - name: Verify third-party notices and source bundle
        run: bash ./scripts/check-license-bundle.sh

      - name: Check formatting
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Compare base..head, not the PR merge commit, so files changed only
            # on main after the branch point are not attributed to this PR.
            diff_range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            base="$BASE_SHA"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              base=$(git rev-parse HEAD^)
            fi
            diff_range="$base..$GITHUB_SHA"
          fi
          unformatted=$(
            git diff --name-only --diff-filter=ACMR -z "$diff_range" -- '*.go' ':!cli/**' |
              xargs -0 -r gofmt -l
          )
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet and test
        shell: bash
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v '/docreader/')
          go vet "${pkgs[@]}"
          go test "${pkgs[@]}"

      - name: Build server
        run: go build ./cmd/server

  docker-image:
    name: Docker image and production startup smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.app
          push: false
          load: true
          tags: weknora-app:ci
          build-args: |
            GOPROXY_ARG=https://proxy.golang.org,direct
            GOSUMDB_ARG=sum.golang.org
            WITH_ANYDOC=0
            VERSION_ARG=ci
            COMMIT_ID_ARG=${{ github.sha }}
            BUILD_TIME_ARG=ci
            GO_VERSION_ARG=${{ env.GO_VERSION }}
          cache-from: type=gha,scope=verify-app-amd64
          cache-to: type=gha,scope=verify-app-amd64,mode=max

      - name: Start APP from schema 93 and verify migration and health
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            docker logs weknora-app-smoke 2>/dev/null || true
            docker rm -f weknora-app-smoke weknora-postgres-smoke 2>/dev/null || true
            docker network rm weknora-app-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          docker network create weknora-app-smoke
          docker run -d --name weknora-postgres-smoke \
            --network weknora-app-smoke \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=weknora \
            paradedb/paradedb:v0.22.2-pg17

          for attempt in $(seq 1 60); do
            if docker exec weknora-postgres-smoke \
              pg_isready -h 127.0.0.1 -p 5432 -U postgres -d weknora; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "PostgreSQL did not become ready"
              exit 1
            fi
            sleep 2
          done

          migration_url='postgres://postgres:postgres@weknora-postgres-smoke:5432/weknora?sslmode=disable&options=-c%20app.skip_embedding=false'
          docker run --rm --network weknora-app-smoke \
            --entrypoint migrate weknora-app:ci \
            -path /app/migrations/versioned -database "$migration_url" goto 93

          docker run -d --name weknora-app-smoke \
            --network weknora-app-smoke \
            -p 127.0.0.1:8080:8080 \
            -e GIN_MODE=release \
            -e DB_DRIVER=postgres \
            -e DB_HOST=weknora-postgres-smoke \
            -e DB_PORT=5432 \
            -e DB_USER=postgres \
            -e DB_PASSWORD=postgres \
            -e DB_NAME=weknora \
            -e RETRIEVE_DRIVER=postgres \
            -e AUTO_MIGRATE=true \
            -e REDIS_ADDR= \
            -e DOCREADER_ADDR=127.0.0.1:50051 \
            weknora-app:ci

          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/health | grep -q '"status":"ok"'; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' weknora-app-smoke | grep -q true; then
              echo "APP exited before becoming healthy"
              exit 1
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "APP did not become healthy"
              exit 1
            fi
            sleep 2
          done

          current_version=$(docker run --rm --network weknora-app-smoke \
            --entrypoint migrate weknora-app:ci \
            -path /app/migrations/versioned -database "$migration_url" version 2>&1 | awk '{print $1}')
          test "$current_version" = "96"
          curl --fail --silent http://127.0.0.1:8080/health | grep -q '"status":"ok"'
