# ADDITIVE HTTP-context file. Original HTTP80 configuration stays frozen.
# This template must not be installed until APP Docker access is removed and
# approved, and a separate frontend/certificate maintenance window is approved.
log_format isolated_tls_meta '$time_iso8601 $status $body_bytes_sent $request_time';
map "$request_method:$http_content_type" $isolated_tls_media_ok {
    default 0;
    '~*^POST:application/json(?:\s*;\s*charset=utf-8)?$' 1;
    'GET:' 1;
    'DELETE:' 1;
    'GET:application/json' 1;
    'DELETE:application/json' 1;
}
map $http_content_encoding $isolated_tls_encoding_ok {
    default 0;
    '' 1;
    'identity' 1;
}
server {
    listen 8443 ssl;
    server_name knowhub.ruijie.com.cn;
    ssl_certificate /etc/knowhub/mcp-tls/fullchain.pem;
    ssl_certificate_key /etc/knowhub/mcp-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_early_data off;
    access_log /var/log/nginx/isolated-mcp-access.log isolated_tls_meta;
    # Error logs can include URI/headers. Monitor status/latency metrics instead.
    error_log /dev/null;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 15s;
    if ($ssl_server_name != 'knowhub.ruijie.com.cn') { return 421; }
    if ($host != 'knowhub.ruijie.com.cn') { return 421; }
    location = /api/v1/mcp/personal {
        if ($request_uri != '/api/v1/mcp/personal') { return 404; }
        if ($request_method !~ '^(GET|POST|DELETE)$') { return 405; }
        if ($isolated_tls_media_ok = 0) { return 415; }
        if ($isolated_tls_encoding_ok = 0) { return 415; }
        # Source IP unrestricted. APP Personal MCP Key authentication is mandatory.
        proxy_pass http://app:8080/internal/mcp/isolated/personal;
        proxy_http_version 1.1;
        proxy_set_header Host knowhub.ruijie.com.cn:8443;
        proxy_set_header Connection '';
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host knowhub.ruijie.com.cn:8443;
        proxy_set_header Forwarded '';
        proxy_set_header X-Environment '';
        proxy_set_header X-Isolated '';
        proxy_next_upstream off;
        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 35s;
        add_header Cache-Control 'no-store' always;
        add_header X-Accel-Buffering 'no' always;
    }
    location / { return 404; }
}
